<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerForge - AI Career Coach</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>CareerForge</h1>
    <p>AI Career Coach</p>
</header>

<main class="coach-container">

    <h2>Ask CareerForge 🤖</h2>

    <p>Ask anything about your career, skills, interviews, or jobs.</p>

    <div id="chatBox"></div>

    <div class="chat-input">
        <input
            type="text"
            id="userInput"
            placeholder="Ask your career question..."
        >

        <button onclick="sendMessage()">Send</button>
    </div>

</main>

<script src="coach.js"></script>

</body>
</html>
