<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerForge - Mock Interview</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>CareerForge</h1>
    <p>AI Mock Interview</p>
</header>

<main class="interview-container">

    <h2>Mock Interview</h2>

    <label for="role">Choose your role:</label>

    <select id="role">
        <option value="software">Software Developer</option>
        <option value="data">Data Analyst</option>
        <option value="ai">AI/ML Engineer</option>
        <option value="ece">Electronics Engineer</option>
    </select>

    <button onclick="startInterview()">Start Interview</button>

    <div id="questionBox"></div>

</main>

<script src="interview.js"></script>

</body>
</html>
