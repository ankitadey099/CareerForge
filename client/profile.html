<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CareerForge - Profile</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>CareerForge</h1>
    <p>Career Profile</p>
</header>

<main class="profile-container">

    <h2>Create Your Career Profile</h2>

    <form id="profileForm">

        <input type="text" id="name" placeholder="Full Name" required>

        <input type="text" id="degree" placeholder="Degree" required>

        <input type="text" id="branch" placeholder="Branch / Specialization" required>

        <input type="text" id="skills" placeholder="Skills (e.g. C++, Python, SQL)" required>

        <input type="text" id="interests" placeholder="Career Interests" required>

        <input type="text" id="experience" placeholder="Experience / Projects">

        <button type="submit">Save Profile</button>

    </form>

</main>

<script src="profile.js"></script>

</body>
</html>
