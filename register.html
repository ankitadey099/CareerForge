<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; background-color: #f8f9fa; color: #212529; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    
    .register-card { background: #ffffff; padding: 32px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); border: 1px solid #e9ecef; width: 100%; max-width: 400px; box-sizing: border-box; }
    .register-card h2 { margin-top: 0; margin-bottom: 20px; font-size: 1.5rem; text-align: center; color: #111827; }
    
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; }
    .form-group input:focus { outline: none; border-color: #0d6efd; box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15); }
    
    .btn { width: 100%; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 0.95rem; margin-top: 8px; }
    .btn-primary { background-color: #0d6efd; color: white; }
    .btn-primary:disabled { background-color: #6c757d; cursor: not-allowed; }
    
    .error-banner { background-color: #f8d7da; color: #721c24; padding: 10px 12px; border-radius: 4px; margin-bottom: 16px; font-size: 0.9rem; border: 1px solid #f5c6cb; }
    
    .auth-footer { text-align: center; margin-top: 20px; font-size: 0.875rem; color: #6c757d; }
    .auth-footer a { color: #0d6efd; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <main class="register-card">
    <h2>Create Account</h2>

    <div id="error-box"></div>

    <form id="register-form">
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" required placeholder="Alex Johnson">
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="you@example.com">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" id="submit-btn" class="btn btn-primary">Create account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </main>

  <script src="register.js"></script>
</body>
</html>
